name: Periodic CI (macOS + Kubo Interop)

on:
  schedule:
    # Run every 6 hours at an offset minute to avoid GitHub herd traffic
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      kubo_version:
        description: Kubo release version for interop tests
        type: string
        required: false
        default: v0.43.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  cache-factory:
    runs-on: ubuntu-latest
    outputs:
      cache_key_ubuntu: ${{ steps.keys.outputs.ubuntu }}
      cache_key_macos: ${{ steps.keys.outputs.macos }}
    steps:
      - name: Compute shared cache keys
        id: keys
        shell: bash
        run: |
          echo "ubuntu=Linux-shared-cache-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "macos=macOS-shared-cache-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/trigger-workflow
        with:
          workflow: cache-factory.yml
          wait: true
          flags: -f clean_build=false

  trigger-macos-ci:
    needs: cache-factory
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/trigger-workflow
        with:
          workflow: ci.yml
          flags: >-
            -f macos_build=true
            -f clang_build=false
            -f cache_key=${{ needs.cache-factory.outputs.cache_key_ubuntu }}

  trigger-kubo-interop:
    needs: cache-factory
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/trigger-workflow
        with:
          workflow: kubo-interop.yml
          flags: >-
            -f interop_mode=ci
            -f verbose=false
            -f kubo_version=${{ inputs.kubo_version || 'v0.43.0' }}
            -f cache_key=${{ needs.cache-factory.outputs.cache_key_ubuntu }}
