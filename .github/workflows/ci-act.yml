name: CI (Act - local cache-less build)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/prepare-repo

      - uses: ./.github/actions/install-build-deps

      - uses: ./.github/actions/build-c-ipfs
        with:
          has-shared-cache: 'false'
          build-tests: true

      - uses: ./.github/actions/smoke-test-ipfs
