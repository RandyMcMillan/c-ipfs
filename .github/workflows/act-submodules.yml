name: Act Submodules CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  act:
    name: Act - ${{ matrix.module }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module:
          - c-libp2p
          - c-libp2p/c-multiaddr
          - c-libp2p/c-multihash
          - c-libp2p/c-protobuf
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/prepare-repo

      - name: Install act
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/nektos/act/master/install.sh | bash
          if [ ! -x ./bin/act ]; then
            echo "act was not installed"
            exit 1
          fi
          sudo install -m 0755 ./bin/act /usr/local/bin/act
          act --version

      - name: Run local CI with act
        working-directory: ${{ matrix.module }}
        shell: bash
        run: make act-build ACT_QUIET=true
