name: CI

on:
  workflow_dispatch:
    inputs:
      clang_build:
        description: Also run an optional clang build
        type: boolean
        required: false
        default: false
      macos_build:
        description: Also run a macOS build
        type: boolean
        required: false
        default: false
      cache_key:
        description: Exact shared cache key produced by the Cache Factory to wait for
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      clang_build:
        description: Also run an optional clang build
        type: boolean
        required: false
        default: false
      macos_build:
        description: Also run a macOS build
        type: boolean
        required: false
        default: false
      cache_key:
        description: Exact shared cache key produced by the Cache Factory to wait for
        type: string
        required: false
        default: ''
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wait-for-cache:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'push' && github.event_name != 'pull_request' && inputs.macos_build == true && '["ubuntu-latest", "macos-latest"]') || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    outputs:
      cache-hit: ${{ steps.shared-cache.outputs.cache-hit }}
    steps:
      - uses: ./.github/actions/prepare-repo

      - name: Poll for shared cache from Cache Factory
        if: inputs.cache_key != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CACHE_KEY="${{ inputs.cache_key }}"
          echo "Waiting for Cache Factory to publish: $CACHE_KEY"
          for i in $(seq 1 60); do
            if gh api "repos/${{ github.repository }}/actions/caches?key=$CACHE_KEY" --jq '.total_count' | grep -q '^[1-9]'; then
              echo "Cache available after $i attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for cache; proceeding without it"
          exit 0

      - name: Restore shared cache
        id: shared-cache
        uses: ./.github/actions/restore-deps-cache
        with:
          key: ${{ runner.os }}-shared-cache-${{ github.sha }}

  build:
    needs: wait-for-cache
    timeout-minutes: 25
    env:
      CLANG_BUILD: ${{ inputs.clang_build || false }}
      HAS_LSQUIC: true
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'push' && github.event_name != 'pull_request' && inputs.macos_build == true && '["ubuntu-latest", "macos-latest"]') || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ./.github/actions/prepare-repo

      - name: Restore shared cache
        id: shared-cache
        uses: ./.github/actions/restore-deps-cache
        with:
          key: ${{ runner.os }}-shared-cache-${{ github.sha }}

      - uses: ./.github/actions/install-build-deps

      - uses: ./.github/actions/build-c-ipfs
        with:
          has-shared-cache: ${{ steps.shared-cache.outputs.cache-hit }}
          build-tests: true

      - uses: ./.github/actions/smoke-test-ipfs

      - name: Smoke test — make selfhost
        shell: bash
        run: make selfhost

      - uses: ./.github/actions/run-test-suite
        with:
          timeout: '180'

      - name: Optional build — clang
        if: env.CLANG_BUILD == 'true'
        shell: bash
        run: |
          make clean all CC=clang
          cd test && make clean all CC=clang

      - name: Build nostril for Nostr tests
        shell: bash
        run: make nostril

      - name: Smoke test — nostril signed event generation
        shell: bash
        run: bash test/scripts/test_nostril.sh

      - name: Smoke test — NIP-34 event generation
        shell: bash
        run: bash test/scripts/test_nostril_nip34.sh

      - name: Publish real c-ipfs test report to Nostr
        if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: bash scripts/nostr_test_report.sh --publish
        continue-on-error: true

      - name: Publish NIP-34 patch event for pull requests
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          NOSTR_SECKEY: ${{ secrets.NOSTR_SECKEY }}
          NOSTR_RELAYS: "wss://relay.damus.io wss://relay.nostr.info"
        shell: bash
        run: bash scripts/nostr_nip34_pr_patch.sh --publish
        continue-on-error: true

      - name: Smoke test — c-libnostr standalone
        shell: bash
        run: |
          cd test
          make test_c_libnostr_standalone
          ./test_c_libnostr_standalone

      - name: Smoke test — git server push/pull
        shell: bash
        run: |
          if [ "${ACT_CI:-}" = "true" ] || [ "${ACT:-}" = "true" ]; then
            echo "Skipping git server push/pull under act"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            bash ./test/scripts/test_git_server_push_pull.sh
          else
            echo "Skipping git server push/pull outside Linux and act-ci"
          fi
