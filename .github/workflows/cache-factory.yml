name: Cache Factory

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: Run `make clean` before building the cache
        type: boolean
        required: false
        default: false
      branch:
        description: Branch to check out (overridden by tag when both are set)
        type: string
        required: false
        default: ''
      tag:
        description: Tag to check out (takes precedence over branch)
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-cache:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: ./.github/actions/prepare-repo
        with:
          fetch-depth: '0'

      - name: Resolve shared cache key
        id: cache-key
        shell: bash
        run: |
          KEY="${{ runner.os }}-shared-cache-$(git rev-parse HEAD)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Shared cache key: $KEY"

      - name: Restore shared cache
        id: shared-cache
        uses: ./.github/actions/restore-deps-cache
        with:
          key: ${{ steps.cache-key.outputs.key }}

      - uses: ./.github/actions/install-build-deps

      - name: Clean build outputs
        if: inputs.clean_build == true
        shell: bash
        run: make clean

      - name: Build shared dependencies
        shell: bash
        run: make nostril libwebsockets boringssl lsquic c-libnostr

      - name: Save shared cache
        uses: ./.github/actions/cache-save
        with:
          path: |
            boringssl/build-c-ipfs
            lsquic/build-c-ipfs
            libwebsockets/build-c-ipfs
            c-libnostr/build
            nostril/deps/secp256k1
            nostril/libsecp256k1.a
            nostril/config.h
          key: ${{ steps.cache-key.outputs.key }}
