name: Kubo Interoperability

on:
  workflow_dispatch:
    inputs:
      interop_mode:
        description: Interop harness mode
        type: choice
        required: false
        default: ci
        options:
          - ci
          - host
          - auto
      verbose:
        description: Enable verbose interop logging
        type: boolean
        required: false
        default: false
      kubo_version:
        description: Kubo release version for interop tests
        type: string
        required: false
        default: v0.43.0
      kubo_source:
        description: How to obtain Kubo (release tarball or build from GitHub source)
        type: choice
        required: false
        default: release
        options:
          - release
          - source
      kubo_ref:
        description: Git ref (branch/tag/commit) to build when kubo_source=source (defaults to kubo_version)
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      interop_mode:
        description: Interop harness mode
        type: string
        required: false
        default: ci
      verbose:
        description: Enable verbose interop logging
        type: boolean
        required: false
        default: false
      kubo_version:
        description: Kubo release version for interop tests
        type: string
        required: false
        default: v0.43.0
      kubo_source:
        description: How to obtain Kubo (release or source)
        type: string
        required: false
        default: release
      kubo_ref:
        description: Git ref to build when kubo_source=source (defaults to kubo_version)
        type: string
        required: false
        default: ''
      cache_key:
        description: Exact shared cache key produced by the Cache Factory to wait for
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wait-for-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/prepare-repo

      - name: Poll for shared cache from Cache Factory
        if: inputs.cache_key != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CACHE_KEY="${{ inputs.cache_key }}"
          echo "Waiting for Cache Factory to publish: $CACHE_KEY"
          for i in $(seq 1 60); do
            if gh api "repos/${{ github.repository }}/actions/caches?key=$CACHE_KEY" --jq '.total_count' | grep -q '^[1-9]'; then
              echo "Cache available after $i attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for cache; proceeding without it"
          exit 0

  kubo-interop:
    needs: wait-for-cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_LSQUIC: true
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: ./.github/actions/prepare-repo

      - name: Restore shared cache
        id: shared-cache
        uses: ./.github/actions/restore-deps-cache
        with:
          key: Linux-shared-cache-${{ github.sha }}

      - uses: ./.github/actions/install-build-deps

      - uses: ./.github/actions/build-c-ipfs
        with:
          has-shared-cache: ${{ steps.shared-cache.outputs.cache-hit }}
          build-tests: false

      - name: Set up Kubo
        id: kubo
        uses: ./.github/actions/kubo-setup
        with:
          kubo-version: ${{ inputs.kubo_version || 'v0.43.0' }}
          kubo-source: ${{ inputs.kubo_source || 'release' }}
          kubo-ref: ${{ inputs.kubo_ref || '' }}

      - name: Run Kubo Interoperability Harness
        env:
          INTEROP_MODE: ${{ inputs.interop_mode || 'ci' }}
          VERBOSE: ${{ inputs.verbose || false }}
          KUBO_VERSION: ${{ inputs.kubo_version || 'v0.43.0' }}
          KUBO_SOURCE: ${{ inputs.kubo_source || 'release' }}
          KUBO_REF: ${{ inputs.kubo_ref || '' }}
          KUBO_BIN_CACHE: ${{ runner.temp }}/kubo-ipfs
          KUBO_BIN: ${{ steps.kubo.outputs.kubo-bin }}
        shell: bash
        run: |
          chmod +x test/scripts/test_kubo_interop.sh test/scripts/test_kubo_ipns_pubsub.sh test/scripts/test_kubo_noise_handshake.sh test/scripts/test_kubo_swarm_connect.sh test/scripts/test_kubo_quic_dial.sh
          ./test/scripts/test_kubo_noise_handshake.sh
          ./test/scripts/test_kubo_swarm_connect.sh
          ./test/scripts/test_kubo_quic_dial.sh
          ./test/scripts/test_kubo_interop.sh
          ./test/scripts/test_kubo_ipns_pubsub.sh
