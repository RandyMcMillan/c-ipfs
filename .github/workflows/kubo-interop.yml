name: Kubo Interoperability

on:
  workflow_dispatch:
    inputs:
      interop_mode:
        description: Interop harness mode
        type: choice
        required: false
        default: ci
        options:
          - ci
          - host
          - auto
      verbose:
        description: Enable verbose interop logging
        type: boolean
        required: false
        default: false
      kubo_version:
        description: Kubo release version for interop tests
        type: string
        required: false
        default: v0.43.0
  workflow_call:
    inputs:
      interop_mode:
        description: Interop harness mode
        type: string
        required: false
        default: ci
      verbose:
        description: Enable verbose interop logging
        type: boolean
        required: false
        default: false
      kubo_version:
        description: Kubo release version for interop tests
        type: string
        required: false
        default: v0.43.0
      cache_key:
        description: Exact shared cache key produced by the Cache Factory to wait for
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wait-for-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Poll for shared cache from Cache Factory
        if: inputs.cache_key != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CACHE_KEY="${{ inputs.cache_key }}"
          echo "Waiting for Cache Factory to publish: $CACHE_KEY"
          for i in $(seq 1 60); do
            if gh api "repos/${{ github.repository }}/actions/caches?key=$CACHE_KEY" --jq '.total_count' | grep -q '^[1-9]'; then
              echo "Cache available after $i attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for cache; proceeding without it"
          exit 0

  kubo-interop:
    needs: wait-for-cache
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Sync submodule URLs
        run: git submodule sync --recursive

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Restore shared cache
        id: shared-cache
        uses: ./.github/actions/cache-restore
        with:
          path: |
            boringssl/build-c-ipfs
            lsquic/build-c-ipfs
            libwebsockets/build-c-ipfs
            c-libnostr/build
            nostril/deps/secp256k1
            nostril/libsecp256k1.a
            nostril/config.h
          key: Linux-shared-cache-${{ github.sha }}
          restore-keys: |
            Linux-shared-cache-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev autoconf automake libtool

      - name: Build secp256k1
        if: steps.shared-cache.outputs.cache-hit != 'true'
        run: |
          cd nostril/deps/secp256k1
          if [ ! -x ./configure ]; then
            ./autogen.sh
          fi
          ./configure --disable-shared --enable-module-ecdh --enable-module-schnorrsig --enable-module-extrakeys
          make -j$(nproc) libsecp256k1.la
          cp .libs/libsecp256k1.a ../../libsecp256k1.a || true

      - name: Build c-libp2p
        run: cd c-libp2p && make all

      - name: Build LMDB
        run: cd lmdb/libraries/liblmdb && make all

      - name: Build c-ipfs
        run: |
          if [ "${HAS_SHARED_CACHE:-false}" = "true" ]; then
            make all
          else
            make clean all
          fi
        env:
          HAS_SHARED_CACHE: ${{ steps.shared-cache.outputs.cache-hit }}

      - name: Run Kubo Interoperability Harness
        env:
          INTEROP_MODE: ${{ inputs.interop_mode || 'ci' }}
          VERBOSE: ${{ inputs.verbose || false }}
          KUBO_VERSION: ${{ inputs.kubo_version || 'v0.43.0' }}
        run: |
          chmod +x test/scripts/test_kubo_interop.sh test/scripts/test_kubo_ipns_pubsub.sh
          ./test/scripts/test_kubo_interop.sh
          ./test/scripts/test_kubo_ipns_pubsub.sh
