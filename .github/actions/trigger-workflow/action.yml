name: Trigger workflow

description: |
  Trigger another workflow via `gh workflow run` and optionally wait for it
  to complete.

inputs:
  workflow:
    description: Name of the workflow file to trigger
    required: true
  ref:
    description: Git ref to run the workflow on
    required: false
    default: ${{ github.ref_name }}
  wait:
    description: Whether to wait for the triggered run to finish
    required: false
    default: 'false'
  interval:
    description: Polling interval when waiting (seconds)
    required: false
    default: '30'
  flags:
    description: Additional `-f key=value` flags to pass to gh workflow run
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Dispatch workflow
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run "${{ inputs.workflow }}" \
          --repo ${{ github.repository }} \
          --ref "${{ inputs.ref }}" \
          ${{ inputs.flags }}

    - name: Wait for dispatched workflow
      if: inputs.wait == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sleep 15
        RUN_ID=$(gh run list \
          --repo ${{ github.repository }} \
          --workflow "${{ inputs.workflow }}" \
          --branch "${{ inputs.ref }}" \
          --event workflow_dispatch \
          --limit 1 \
          --json databaseId --jq '.[0].databaseId')
        echo "Triggered run id: $RUN_ID"
        gh run watch "$RUN_ID" \
          --repo ${{ github.repository }} \
          --exit-status \
          --interval ${{ inputs.interval }}
