# Local mirror of actions/cache/save v4.3.0
# (0057852bfaa89a56745cba8c7296529d2fc39830).
#
# Workflows in this repository are also run locally with `act`, which cannot
# resolve subpath action references such as `actions/cache/save@v4`. This shim
# pins the upstream `save` entrypoint so both GitHub Actions and `act` can
# execute it as a plain local composite target.
name: 'Save a cache'
description: 'Save Cache artifacts like dependencies and build outputs to improve workflow execution time'
author: 'GitHub'
inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to cache'
    required: true
  key:
    description: 'An explicit key for saving the cache'
    required: true
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes'
    required: false
  enableCrossOsArchive:
    description: 'An optional boolean when enabled, allows windows runners to save caches that can be restored on other platforms'
    default: 'false'
    required: false
runs:
  using: 'node20'
  main: 'index.js'
branding:
  icon: 'archive'
  color: 'gray-dark'
