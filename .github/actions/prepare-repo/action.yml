name: Prepare repository

description: |
  Sync submodule URLs and update submodules.  The calling workflow must check
  out the repository first.

runs:
  using: composite
  steps:
    - name: Sync submodule URLs
      shell: bash
      run: git submodule sync --recursive

    - name: Update submodules
      shell: bash
      run: git submodule update --init --recursive
